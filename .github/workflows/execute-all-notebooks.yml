name: Execute All Notebooks

on:
  workflow_dispatch:
    inputs:
      # FUTURE USE:
      # Maintainers can provide a PR number or existing upstream branch name to run this
      # job against. If no PR number or branch name is provided, this job will run against
      # content in the "main" branch instead.
      pr_or_branch:
        description: "Pull request number or branch name"
        required: true
        default: "main"
  push:
    branches:
      - main
    paths:
      - "notebooks/**/*.ipynb"
      - ".github/workflows/execute-all-notebooks.yml"

# We don't need anything other than Bash for our shell..
defaults:
  run:
    shell: bash

jobs:
  execute-all-notebooks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MILVUS_LITE_WORK_DIR: "/tmp/milvus_lite_work"
      HOME: "/tmp/milvus_lite_work"
      XDG_CACHE_HOME: "/tmp/milvus_lite_work"
      PYTHONPATH: ${{ github.workspace }}

    steps:
      # Create the redirected HOME/work directory first so that later steps
      # (and the notebooks themselves) can safely write into it.
      - name: Prepare Milvus Lite work directory
        run: mkdir -p "${{ env.MILVUS_LITE_WORK_DIR }}"

      - uses: actions/checkout@v6

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          # Setup Pip
          python -m pip install --upgrade pip setuptools wheel

          # Install test requirements (CPU-only: the notebooks install their
          # own dependencies, such as docling/torch, from PyPI at runtime)
          python -m pip install -r requirements-dev.txt
          python -m pip install -r scripts/subset_selection/requirements.txt

          # Register Kernel
          python -m ipykernel install --name "python3.11" --user

      - name: Execute Notebooks
        run: |
          export PYTHONPATH="$(pwd):$PYTHONPATH"
          cd tests
          python -m pytest test_notebook_execution.py -v --tb=short
