          \ relationships and connections between components. \"\n            \"Note\
          \ directional flows (arrows) and their labels. \"\n            \"Identify\
          \ groupings, layers, or zones. \"\n            \"Use a nested list to represent\
          \ the hierarchy, or a table for \"\n            \"components and connections.\
          \ \"\n            \"Preserve any annotations, version numbers, or metadata\
          \ shown.\"\n        ),\n        \"other\": (\n            \"Describe the\
          \ content of this image in structured Markdown. \"\n            \"Preserve\
          \ all visible text, numbers, labels, and structural information. \"\n  \
          \          \"Use appropriate Markdown formatting \u2014 tables for tabular\
          \ data, \"\n            \"lists for hierarchical or sequential content,\
          \ and headings for sections. \"\n            \"Capture any legends, footnotes,\
          \ or annotations.\"\n        ),\n    }\n\n    VALID_TYPES = set(INTERPRETATION_PROMPTS.keys())\n\
          \n    # --- Read VLM credentials from mounted secret or environment variables\
          \ ---\n    def read_secret(name):\n        fpath = os.path.join(vlm_secret_mount_path,\
          \ name)\n        if os.path.isfile(fpath):\n            with open(fpath)\
          \ as f:\n                return f.read().strip()\n        env_val = os.environ.get(name)\n\
          \        if env_val is not None:\n            return env_val\n        raise\
          \ ValueError(\n            f\"Key {name} not found in secret mount {vlm_secret_mount_path}\
          \ \"\n            f\"or environment variable {name}\"\n        )\n\n   \
          \ if not os.path.exists(vlm_secret_mount_path):\n        print(\n      \
          \      f\"Secret mount path {vlm_secret_mount_path} not found, \"\n    \
          \        \"falling back to environment variables\",\n            flush=True,\n\
          \        )\n\n    vlm_endpoint_url = read_secret(\"REMOTE_MODEL_ENDPOINT_URL\"\
          )\n    vlm_model_name = read_secret(\"REMOTE_MODEL_NAME\")\n    vlm_api_key\
          \ = read_secret(\"REMOTE_MODEL_API_KEY\")\n\n    if not vlm_endpoint_url.endswith(\"\
          /v1/chat/completions\"):\n        vlm_endpoint_url = vlm_endpoint_url.rstrip(\"\
          /\")\n        if not vlm_endpoint_url.endswith(\"/v1\"):\n            vlm_endpoint_url\
          \ += \"/v1\"\n        vlm_endpoint_url += \"/chat/completions\"\n\n    input_path_p\
          \ = Path(input_path.path)\n    output_path_p = Path(output_path.path)\n\
          \    output_path_p.mkdir(parents=True, exist_ok=True)\n\n    # --- VLM call\
          \ helper with retries ---\n    def call_vlm(image_b64, prompt, max_tokens):\n\
          \        payload = {\n            \"model\": vlm_model_name,\n         \
          \   \"messages\": [\n                {\n                    \"role\": \"\
          user\",\n                    \"content\": [\n                        {\"\
          type\": \"text\", \"text\": prompt},\n                        {\n      \
          \                      \"type\": \"image_url\",\n                      \
          \      \"image_url\": {\"url\": f\"data:image/png;base64,{image_b64}\"},\n\
          \                        },\n                    ],\n                }\n\
          \            ],\n            \"max_tokens\": max_tokens,\n        }\n  \
          \      headers = {}\n        if vlm_api_key:\n            headers[\"Authorization\"\
          ] = f\"Bearer {vlm_api_key}\"\n\n        for attempt in range(3):\n    \
          \        try:\n                resp = requests.post(\n                 \
          \   vlm_endpoint_url,\n                    json=payload,\n             \
          \       headers=headers,\n                    timeout=vlm_timeout,\n   \
          \             )\n                resp.raise_for_status()\n             \
          \   return resp.json()[\"choices\"][0][\"message\"][\"content\"]\n     \
          \       except (requests.RequestException, KeyError, IndexError) as e:\n\
          \                if attempt < 2:\n                    wait = 2 ** (attempt\
          \ + 1)\n                    print(\n                        f\"  VLM call\
          \ attempt {attempt + 1} failed: {e}. \"\n                        f\"Retrying\
          \ in {wait}s...\",\n                        flush=True,\n              \
          \      )\n                    time.sleep(wait)\n                else:\n\
          \                    raise RuntimeError(f\"VLM call failed after 3 attempts:\
          \ {e}\") from e\n\n    def resolve_image_path(img_ref, doc_name):\n    \
          \    \"\"\"Try multiple strategies to find the image file.\"\"\"\n     \
          \   candidates = [\n            input_path_p / img_ref,\n            input_path_p\
          \ / doc_name / img_ref,\n            input_path_p / Path(img_ref).name,\n\
          \        ]\n        for candidate in candidates:\n            if candidate.exists():\n\
          \                return candidate\n        found = list(input_path_p.rglob(Path(img_ref).name))\n\
          \        if found:\n            return found[0]\n        return None\n\n\
          \    # --- Process each document ---\n    md_files = sorted(input_path_p.glob(\"\
          *.md\"))\n    if not md_files:\n        print(\n            \"interpret-policy-artifacts:\
          \ no markdown files found, nothing to process\",\n            flush=True,\n\
          \        )\n        return\n\n    print(\n        f\"interpret-policy-artifacts:\
          \ processing {len(md_files)} document(s)\",\n        flush=True,\n    )\n\
          \n    img_pattern = re.compile(r\"!\\[([^\\]]*)\\]\\(([^)]+)\\)\")\n\n \
          \   for md_file in md_files:\n        doc_name = md_file.stem\n        print(f\"\
          interpret-policy-artifacts: processing {doc_name}\", flush=True)\n\n   \
          \     md_content = md_file.read_text(encoding=\"utf-8\")\n        matches\
          \ = list(img_pattern.finditer(md_content))\n\n        if not matches:\n\
          \            print(f\"  {doc_name}: no images found, copying markdown as-is\"\
          , flush=True)\n            shutil.copy2(md_file, output_path_p / f\"{doc_name}_policy.md\"\
          )\n            json_src = input_path_p / f\"{doc_name}.json\"\n        \
          \    if json_src.exists():\n                shutil.copy2(json_src, output_path_p\
          \ / f\"{doc_name}.json\")\n            continue\n\n        print(f\"  {doc_name}:\
          \ found {len(matches)} image(s) to interpret\", flush=True)\n\n        artifacts_metadata\
          \ = []\n        assembled_md = md_content\n\n        for idx, match in enumerate(matches):\n\
          \            img_ref = match.group(2)\n            full_match_text = match.group(0)\n\
          \n            img_path = resolve_image_path(img_ref, doc_name)\n       \
          \     if img_path is None:\n                print(f\"  {doc_name}: image\
          \ {img_ref} not found, skipping\", flush=True)\n                continue\n\
          \n            with open(img_path, \"rb\") as f:\n                img_b64\
          \ = base64.b64encode(f.read()).decode(\"utf-8\")\n\n            # Step 1:\
          \ Classify artifact type\n            print(\n                f\"  {doc_name}:\
          \ classifying image {idx + 1}/{len(matches)}...\",\n                flush=True,\n\
          \            )\n            raw_type = call_vlm(img_b64, CLASSIFICATION_PROMPT,\
          \ max_tokens=20)\n            artifact_type = raw_type.strip().lower().replace(\"\
          \ \", \"_\")\n            if artifact_type not in VALID_TYPES:\n       \
          \         artifact_type = \"other\"\n            print(\n              \
          \  f\"  {doc_name}: image {idx + 1} classified as '{artifact_type}'\",\n\
          \                flush=True,\n            )\n\n            # Step 2: Interpret\
          \ with type-specific prompt\n            print(\n                f\"  {doc_name}:\
          \ interpreting image {idx + 1} as {artifact_type}...\",\n              \
          \  flush=True,\n            )\n            interpretation = call_vlm(\n\
          \                img_b64,\n                INTERPRETATION_PROMPTS[artifact_type],\n\
          \                max_tokens=vlm_max_tokens,\n            )\n\n         \
          \   # Step 3: Build replacement with artifact markers\n            replacement\
          \ = (\n                f\"<!-- artifact: {artifact_type} -->\\n\"\n    \
          \            f\"{interpretation.strip()}\\n\"\n                f\"<!-- /artifact\
          \ -->\"\n            )\n            assembled_md = assembled_md.replace(full_match_text,\
          \ replacement, 1)\n\n            artifacts_metadata.append(\n          \
          \      {\n                    \"index\": idx,\n                    \"type\"\
          : artifact_type,\n                    \"source_image\": str(img_ref),\n\
          \                    \"interpretation\": interpretation.strip(),\n     \
          \           }\n            )\n\n        # Save assembled policy markdown\n\
          \        policy_md_path = output_path_p / f\"{doc_name}_policy.md\"\n  \
          \      policy_md_path.write_text(assembled_md, encoding=\"utf-8\")\n   \
          \     print(f\"  {doc_name}: saved {policy_md_path.name}\", flush=True)\n\
          \n        # Save artifact metadata in a subdirectory to avoid conflicts\
          \ with\n        # the chunker, which globs *.json and validates as DoclingDocument\n\
          \        metadata_dir = output_path_p / \"metadata\"\n        metadata_dir.mkdir(parents=True,\
          \ exist_ok=True)\n        artifacts_json_path = metadata_dir / f\"{doc_name}_artifacts.json\"\
          \n        with open(artifacts_json_path, \"w\", encoding=\"utf-8\") as f:\n\
          \            json.dump(\n                {\n                    \"document\"\
          : doc_name,\n                    \"total_artifacts\": len(artifacts_metadata),\n\
          \                    \"artifacts\": artifacts_metadata,\n              \
          \  },\n                f,\n                indent=2,\n                ensure_ascii=False,\n\
          \            )\n        print(f\"  {doc_name}: saved {artifacts_json_path.name}\"\
          , flush=True)\n\n        # Copy DoclingDocument JSON for downstream consumers\
          \ and chunking\n        json_src = input_path_p / f\"{doc_name}.json\"\n\
          \        if json_src.exists():\n            shutil.copy2(json_src, output_path_p\
          \ / f\"{doc_name}.json\")\n\n    print(\"interpret-policy-artifacts: done\"\
          , flush=True)\n\n"
        image: quay.io/fabianofranz/docling-ubi9:2.54.0
        resources:
          cpuLimit: 2.0
          cpuRequest: 0.25
          memoryLimit: 4.0
          memoryRequest: 0.512
          resourceCpuLimit: '2'
          resourceCpuRequest: 250m
          resourceMemoryLimit: 4G
          resourceMemoryRequest: 512M
pipelineInfo:
  description: Policy document conversion pipeline with artifact-type-specific VLM
    interpretation by the Data Processing Team
  name: data-processing-docling-vlm-policy-pipeline
root:
  dag:
    tasks:
      create-pdf-splits:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-create-pdf-splits
        dependentTasks:
        - import-pdfs
        inputs:
          artifacts:
            input_path:
              taskOutputArtifact:
                outputArtifactKey: output_path
                producerTask: import-pdfs
          parameters:
            num_splits:
              componentInputParameter: num_splits
        taskInfo:
          name: create-pdf-splits
      download-docling-models:
        cachingOptions: {}
        componentRef:
          name: comp-download-docling-models
        inputs:
          parameters:
            pipeline_type:
              runtimeValue:
                constant: standard
            remote_model_endpoint_enabled:
              runtimeValue:
                constant: false
        taskInfo:
          name: download-docling-models
      for-loop-1:
        componentRef:
          name: comp-for-loop-1
        dependentTasks:
        - create-pdf-splits
        - download-docling-models
        - import-pdfs
        inputs:
          artifacts:
            pipelinechannel--download-docling-models-output_path:
              taskOutputArtifact:
                outputArtifactKey: output_path
                producerTask: download-docling-models
            pipelinechannel--import-pdfs-output_path:
              taskOutputArtifact:
                outputArtifactKey: output_path
                producerTask: import-pdfs
          parameters:
            pipelinechannel--create-pdf-splits-Output:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: create-pdf-splits
            pipelinechannel--docling_chunk_enabled:
              componentInputParameter: docling_chunk_enabled
            pipelinechannel--docling_chunk_max_tokens:
              componentInputParameter: docling_chunk_max_tokens
            pipelinechannel--docling_chunk_merge_peers:
              componentInputParameter: docling_chunk_merge_peers
            pipelinechannel--docling_num_threads:
              componentInputParameter: docling_num_threads
            pipelinechannel--docling_ocr:
              componentInputParameter: docling_ocr
            pipelinechannel--docling_table_mode:
              componentInputParameter: docling_table_mode
            pipelinechannel--docling_timeout_per_document:
              componentInputParameter: docling_timeout_per_document
            pipelinechannel--vlm_max_tokens:
              componentInputParameter: vlm_max_tokens
            pipelinechannel--vlm_timeout:
              componentInputParameter: vlm_timeout
        parameterIterator:
          itemInput: pipelinechannel--create-pdf-splits-Output-loop-item
          items:
            inputParameter: pipelinechannel--create-pdf-splits-Output
        taskInfo:
          name: for-loop-1
      import-pdfs:
        cachingOptions: {}
        componentRef:
          name: comp-import-pdfs
        inputs:
          parameters:
            base_url:
              componentInputParameter: pdf_base_url
            filenames:
              componentInputParameter: pdf_filenames
            from_s3:
              componentInputParameter: pdf_from_s3
            s3_secret_mount_path:
              runtimeValue:
                constant: /mnt/secrets
        taskInfo:
          name: import-pdfs
  inputDefinitions:
    parameters:
      docling_chunk_enabled:
        defaultValue: false
        isOptional: true
        parameterType: BOOLEAN
      docling_chunk_max_tokens:
        defaultValue: 512.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      docling_chunk_merge_peers:
        defaultValue: true
        isOptional: true
        parameterType: BOOLEAN
      docling_num_threads:
        defaultValue: 4.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      docling_ocr:
        defaultValue: true
        isOptional: true
        parameterType: BOOLEAN
      docling_table_mode:
        defaultValue: accurate
        isOptional: true
        parameterType: STRING
      docling_timeout_per_document:
        defaultValue: 300.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      num_splits:
        defaultValue: 3.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      pdf_base_url:
        defaultValue: https://github.com/docling-project/docling/raw/v2.43.0/tests/data/pdf
        isOptional: true
        parameterType: STRING
      pdf_filenames:
        defaultValue: 2203.01017v2.pdf
        isOptional: true
        parameterType: STRING
      pdf_from_s3:
        defaultValue: false
        isOptional: true
        parameterType: BOOLEAN
      vlm_max_tokens:
        defaultValue: 1024.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      vlm_timeout:
        defaultValue: 120.0
        isOptional: true
        parameterType: NUMBER_INTEGER
schemaVersion: 2.1.0
sdkVersion: kfp-2.14.6
---
platforms:
  kubernetes:
    deploymentSpec:
      executors:
        exec-import-pdfs:
          secretAsVolume:
          - mountPath: /mnt/secrets
            optional: true
            secretName: data-processing-docling-pipeline
            secretNameParameter:
              runtimeValue:
                constant: data-processing-docling-pipeline
        exec-interpret-policy-artifacts:
          secretAsVolume:
          - mountPath: /mnt/secrets
            optional: false
            secretName: data-processing-docling-pipeline
            secretNameParameter:
              runtimeValue:
                constant: data-processing-docling-pipeline
